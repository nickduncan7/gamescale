<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- gamescale-symbolic: display with native-mode window + scale-down arrow -->
  <g fill="#bebebe">
    <!-- monitor frame with screen knocked out -->
    <path fill-rule="evenodd"
          d="M 2.5 1 h 11 A 1.5 1.5 0 0 1 15 2.5 v 8 A 1.5 1.5 0 0 1 13.5 12 h -11 A 1.5 1.5 0 0 1 1 10.5 v -8 A 1.5 1.5 0 0 1 2.5 1 Z
             M 3 3 v 7 h 10 V 3 Z"/>
    <!-- stand -->
    <rect x="5" y="13.5" width="6" height="1.5" rx="0.75"/>
    <!-- native window, anchored top-left -->
    <rect x="3" y="3" width="5" height="4"/>
  </g>
  <!-- diagonal resize tick from the window corner -->
  <line x1="8.9" y1="7.3" x2="11.9" y2="9.0"
        stroke="#bebebe" stroke-width="1.8" stroke-linecap="round"/>
</svg>
