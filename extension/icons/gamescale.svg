<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="native" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
  </defs>

  <!-- stand -->
  <path d="M 54 88 h 20 l 4 12 h -28 z" fill="#241f31"/>
  <rect x="38" y="100" width="52" height="7" rx="3.5" fill="url(#frame)"/>

  <!-- monitor body -->
  <rect x="8" y="12" width="112" height="80" rx="9" fill="url(#frame)"/>
  <!-- screen -->
  <rect x="15" y="19" width="98" height="66" rx="4" fill="url(#screen)"/>

  <!-- overscaled framebuffer (ghost) -->
  <rect x="23" y="27" width="74" height="48" rx="3" fill="none"
        stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"
        stroke-dasharray="7 5"/>

  <!-- native mode window -->
  <rect x="23" y="27" width="46" height="30" rx="3" fill="url(#native)"/>

  <!-- gamepad glyph on the native window -->
  <g fill="#1a5fb4">
    <rect x="32" y="36" width="28" height="13" rx="6.5"/>
  </g>
  <g fill="#ffffff">
    <rect x="36.5" y="41.25" width="8" height="2.6" rx="1.3"/>
    <rect x="39.2" y="38.55" width="2.6" height="8" rx="1.3"/>
    <circle cx="53" cy="40.5" r="1.9"/>
    <circle cx="56" cy="44" r="1.9"/>
  </g>

  <!-- scale-down arrow -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="#ffffff">
    <line x1="91" y1="70" x2="77" y2="61"/>
    <path d="M 72 58 l 10 0.6 l -5.4 8.4 z" stroke="none"/>
  </g>

  <!-- top edge highlight -->
  <rect x="15" y="19" width="98" height="10" rx="4" fill="#ffffff" opacity="0.08"/>
</svg>
